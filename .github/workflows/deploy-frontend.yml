# ═══════════════════════════════════════════════════════════════
#  Deploy Frontend to GitHub Pages
# ═══════════════════════════════════════════════════════════════
#  Workflow ini otomatis deploy folder `frontend/` ke GitHub Pages
#  setiap kali ada push ke branch `main`.
#
#  Setup (sekali saja):
#   1. Repo Settings → Pages → Source: "GitHub Actions"
#   2. Setelah push pertama, akses:
#      https://USERNAME.github.io/Alvend-Ready-Mix/
# ═══════════════════════════════════════════════════════════════

name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:  # Bisa trigger manual dari tab Actions

# Set permissions yang diperlukan oleh GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Izinkan satu deployment berjalan bersamaan
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── JOB 1: BUILD & UPLOAD ARTIFACT ──────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend folder as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

  # ── JOB 2: DEPLOY KE GITHUB PAGES ───────────────────────────
  deploy:
    needs: build # Wajib menunggu job build selesai sukses
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
