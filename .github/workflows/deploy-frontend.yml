# ═══════════════════════════════════════════════════════════════
#  Deploy Frontend to GitHub Pages
# ═══════════════════════════════════════════════════════════════
#  Workflow ini otomatis deploy folder `frontend/` ke GitHub Pages
#  setiap kali ada push ke branch `main`.
#
#  Setup (sekali saja):
#   1. Repo Settings → Pages → Source: "GitHub Actions"
#   2. Setelah push pertama, akses:
#      https://USERNAME.github.io/alvend-readymix/
# ═══════════════════════════════════════════════════════════════

name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:  # Bisa trigger manual dari tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend folder as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

