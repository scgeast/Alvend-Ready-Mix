<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALVEND Readymix Management</title>

  <!-- ═══════════ EXTERNAL LIBRARIES (CDN) ═══════════ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- ═══════════ PROJECT STYLES ═══════════ -->
  <!-- Load berurutan — base dulu, lalu komponen, terakhir responsive -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/topbar.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- ═══════════ PROJECT SCRIPTS (urutan PENTING!) ═══════════ -->
  <!-- config.js     → inisialisasi supabaseClient          -->
  <!-- constants.js  → DEVELOPER_DEFAULT_ACCOUNT, dll       -->
  <!-- utils.js      → todayISO                             -->
  <!-- db.js         → DB object (CRUD Supabase)            -->
  <!-- auth.js       → trySupabaseAuth, signOutSupabaseAuth -->
  <!-- activity-log.js → appendActivityLogAsync, dll       -->
  <!-- app.js        → function app() (Alpine.js component) -->
  <!-- Alpine.js dimuat terakhir dengan defer supaya       -->
  <!-- semua dependency siap dipakai saat init() dipanggil. -->
  <script src="js/config.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/activity-log.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800">

<div x-data="app()" x-init="init()" x-cloak>

  <!-- ═══════════ FATAL ERROR (Supabase tidak terhubung) ═══════════ -->
  <template x-if="fatalError">
    <div class="fixed inset-0 z-[9999] bg-white flex items-center justify-center p-6">
      <div class="max-w-md text-center">
        <div class="text-6xl mb-4">⚠️</div>
        <h2 class="text-xl font-bold text-red-600 mb-2">Koneksi Supabase Gagal</h2>
        <p class="text-slate-600 text-sm mb-4" x-text="fatalError"></p>
        <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800 text-left">
          <p class="font-bold mb-1">Cek hal berikut:</p>
          <ul class="list-disc list-inside space-y-1">
            <li>File <code>supabase_schema.sql</code> sudah dijalankan di Supabase SQL Editor</li>
            <li><code>SUPABASE_URL</code> dan <code>SUPABASE_PUBLISHABLE_KEY</code> sudah benar di <code>js/config.js</code></li>
            <li>Koneksi internet aktif</li>
          </ul>
        </div>
      </div>
    </div>
  </template>

  <!-- ═══════════ LOGIN PAGE ═══════════ -->
  <div x-show="!currentUser" class="alvend-login">
    <div class="login-wrapper">
      <div class="login-left">
        <div class="login-left-content">
          <h1>ALVEND Ready-Mix<br>Concrete<br>Management System</h1>
          <p class="login-left-subtitle">Alvend Readymix Management Service</p>
        </div>
      </div>
      <div class="login-right">
        <div class="login-logo">
          <img src="assets/logo.png" alt="ALVEND" class="login-logo-img">
        </div>
        <form class="login-form" @submit.prevent="login()">
          <div class="form-group">
            <label>User ID / Email</label>
            <input x-model="loginForm.username" type="text" required placeholder="Masukkan User ID atau Email Anda" autocomplete="username" @keyup.enter="login()">
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="alvend-password-wrap">
              <input x-model="loginForm.password" :type="showLoginPw?'text':'password'" required placeholder="Masukkan password" autocomplete="current-password" @keyup.enter="login()">
              <button type="button" class="alvend-password-toggle" @click="showLoginPw=!showLoginPw" aria-label="Tampilkan password">
                <i :class="showLoginPw?'fa-solid fa-eye-slash':'fa-solid fa-eye'"></i>
              </button>
            </div>
          </div>
          <template x-if="loginError">
            <div class="form-group"><div class="error-box" x-text="loginError"></div></div>
          </template>
          <button type="submit" class="btn-login">Login</button>
          <a href="#" class="forgot-link" @click.prevent>Masuk menggunakan User ID yang diberikan Owner</a>
        </form>
      </div>
    </div>
    <div class="login-footer">
      <span>🌐 ID</span>
      <span>Created By Kim Jong Un — November 2026</span>
    </div>
  </div>

  <!-- ═══════════ APP (post-login) ═══════════ -->
  <template x-if="currentUser">
    <div class="app-wrapper">

      <!-- ─────── SIDEBAR ─────── -->
      <aside :class="sidebarOpen?'sidebar':'sidebar collapsed'">
        <div class="sidebar-header">
          <div class="logo">ALVEND Readymix<span class="logo-sub">ARM Management</span></div>
          <span class="version">V4 · PRO</span>
        </div>
        <nav class="sidebar-menu">
          <template x-if="hasAccess('dashboard')">
            <a href="#page=dashboard" @click.prevent="nav('dashboard')" :class="page==='dashboard'?'active':''" class="menu-link">
              <i class="fa-solid fa-gauge-high w-5"></i><span x-show="sidebarOpen">Dashboard</span>
            </a>
          </template>
          <template x-if="hasAccess('inputProspek') || hasAccess('dataProspek')">
            <div x-show="sidebarOpen" class="text-xs text-slate-500 mt-4 px-2">PROSPEK</div>
          </template>
          <a x-show="hasAccess('inputProspek')" href="#page=inputProspek" @click.prevent="nav('inputProspek')" :class="page==='inputProspek'?'active':''" class="menu-link">
            <i class="fa-solid fa-plus-circle w-5"></i><span x-show="sidebarOpen">Input Prospek</span>
          </a>
          <a x-show="hasAccess('dataProspek')" href="#page=dataProspek" @click.prevent="nav('dataProspek')" :class="page==='dataProspek'?'active':''" class="menu-link">
            <i class="fa-solid fa-list w-5"></i><span x-show="sidebarOpen">Data Prospek</span>
            <template x-if="unreadNotifCount>0">
              <span class="ml-auto bg-red-500 text-white text-xs rounded-full px-2 py-0.5" x-text="unreadNotifCount"></span>
            </template>
          </a>
          <template x-if="hasAccess('inputOrder') || hasAccess('orderSearch') || hasAccess('marketing')">
            <div x-show="sidebarOpen" class="text-xs text-slate-500 mt-4 px-2">ORDER</div>
          </template>
          <a x-show="hasAccess('inputOrder')" href="#page=inputOrder" @click.prevent="nav('inputOrder')" :class="page==='inputOrder'?'active':''" class="menu-link">
            <i class="fa-solid fa-cart-plus w-5"></i><span x-show="sidebarOpen">Input Order</span>
          </a>
          <a x-show="hasAccess('orderSearch')" href="#page=orderSearch" @click.prevent="nav('orderSearch')" :class="page==='orderSearch'?'active':''" class="menu-link">
            <i class="fa-solid fa-magnifying-glass w-5"></i><span x-show="sidebarOpen">Order Search</span>
          </a>
          <a x-show="hasAccess('marketing')" href="#page=marketing" @click.prevent="nav('marketing')" :class="page==='marketing'?'active':''" class="menu-link">
            <i class="fa-solid fa-chart-line w-5"></i><span x-show="sidebarOpen">Marketing</span>
          </a>
          <template x-if="hasAccess('jadwal') || hasAccess('afterDelivery')">
            <div x-show="sidebarOpen" class="text-xs text-slate-500 mt-4 px-2">PENGIRIMAN</div>
          </template>
          <a x-show="hasAccess('jadwal')" href="#page=jadwal" @click.prevent="nav('jadwal')" :class="page==='jadwal'?'active':''" class="menu-link">
            <i class="fa-solid fa-calendar-days w-5"></i><span x-show="sidebarOpen">Jadwal Pengecoran</span>
          </a>
          <a x-show="hasAccess('afterDelivery')" href="#page=afterDelivery" @click.prevent="nav('afterDelivery')" :class="page==='afterDelivery'?'active':''" class="menu-link">
            <i class="fa-solid fa-truck-fast w-5"></i><span x-show="sidebarOpen">After Delivery</span>
          </a>
          <template x-if="isOwnerOrDeveloper()">
            <div>
              <div x-show="sidebarOpen" class="text-xs text-slate-500 mt-4 px-2">OWNER</div>
              <a href="#page=proposeSiteNo" @click.prevent="nav('proposeSiteNo')" :class="page==='proposeSiteNo'?'active':''" class="menu-link">
                <i class="fa-solid fa-file-signature w-5"></i><span x-show="sidebarOpen">Approval Site No</span>
              </a>
              <a href="#page=kelolaUser" @click.prevent="nav('kelolaUser')" :class="page==='kelolaUser'?'active':''" class="menu-link">
                <i class="fa-solid fa-users w-5"></i><span x-show="sidebarOpen">Kelola User</span>
              </a>
              <a href="#page=kelolaHakAkses" @click.prevent="nav('kelolaHakAkses')" :class="page==='kelolaHakAkses'?'active':''" class="menu-link">
                <i class="fa-solid fa-key w-5"></i><span x-show="sidebarOpen">Kelola Hak Akses</span>
              </a>
              <a href="#page=kelolaPlant" @click.prevent="nav('kelolaPlant')" :class="page==='kelolaPlant'?'active':''" class="menu-link">
                <i class="fa-solid fa-industry w-5"></i><span x-show="sidebarOpen">Kelola Plant</span>
              </a>
              <a href="#page=kelolaMutu" @click.prevent="nav('kelolaMutu')" :class="page==='kelolaMutu'?'active':''" class="menu-link">
                <i class="fa-solid fa-flask w-5"></i><span x-show="sidebarOpen">Kelola Mutu</span>
              </a>
              <a href="#page=kelolaKompetitor" @click.prevent="nav('kelolaKompetitor')" :class="page==='kelolaKompetitor'?'active':''" class="menu-link">
                <i class="fa-solid fa-flag w-5"></i><span x-show="sidebarOpen">Kelola Kompetitor</span>
              </a>
              <a href="#page=kelolaAlamat" @click.prevent="nav('kelolaAlamat')" :class="page==='kelolaAlamat'?'active':''" class="menu-link">
                <i class="fa-solid fa-map-location-dot w-5"></i><span x-show="sidebarOpen">Kelola Alamat</span>
              </a>
              <a href="#page=logAktivitas" @click.prevent="nav('logAktivitas')" :class="page==='logAktivitas'?'active':''" class="menu-link">
                <i class="fa-solid fa-clock-rotate-left w-5"></i><span x-show="sidebarOpen">Log Aktivitas</span>
              </a>
            </div>
          </template>
        </nav>
        <div class="sidebar-footer">
          <button @click="logout()" class="btn-logout">
            <i class="fa-solid fa-right-from-bracket"></i> <span x-show="sidebarOpen">Logout</span>
          </button>
        </div>
      </aside>

      <!-- ─────── MAIN CONTENT ─────── -->
      <main :class="sidebarOpen?'main-content':'main-content expanded'">
        <header class="topbar">
          <div class="topbar-title-wrap">
            <button @click="sidebarOpen=!sidebarOpen" class="sidebar-toggle-inline" title="Toggle Sidebar">
              <i class="fa-solid fa-bars"></i>
            </button>
            <div class="topbar-title" x-text="pageTitle"></div>
          </div>
          <div class="topbar-right">
            <template x-if="isOwnerOrDeveloper()">
              <button @click="refreshData()" class="topbar-refresh" title="Refresh data" aria-label="Refresh data"><i class="fa-solid fa-rotate"></i></button>
            </template>
            <template x-if="hasAccess('dataProspek') && unreadNotifCount>0">
              <button @click="nav('dataProspek')" class="btn-danger btn-xs-alvend animate-pulse-red"><i class="fa-solid fa-bell"></i> <span x-text="unreadNotifCount + ' Repeat Order'"></span></button>
            </template>
            <span class="live-indicator" title="Live" aria-label="Live"></span>
            <button @click="nav('profil')" class="topbar-user" title="Klik untuk buka profil">
              <template x-if="currentUser.avatar"><img :src="currentUser.avatar" alt="Avatar" class="top-avatar"></template>
              <template x-if="!currentUser.avatar"><span class="top-avatar top-avatar-fallback" x-text="(currentUser.name||'?').charAt(0).toUpperCase()"></span></template>
              <span x-text="currentUser.name"></span>
            </button>
          </div>
        </header>

        <div class="content-area">
          <template x-if="toast">
            <div :class="toastType==='error'?'bg-red-50 text-red-800 border-red-200':'bg-emerald-50 text-emerald-800 border-emerald-200'" class="mb-4 p-3 rounded-lg border text-sm" x-text="toast"></div>
          </template>

          <template x-if="hasAccess('dataProspek') && unreadNotifCount>0">
            <div class="mb-3 p-4 bg-amber-50 border-2 border-amber-300 rounded-lg flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="bg-amber-500 text-white rounded-full w-10 h-10 flex items-center justify-center">
                  <i class="fa-solid fa-bell text-lg"></i>
                </div>
                <div>
                  <p class="font-bold text-amber-900"><span x-text="unreadNotifCount"></span> Permintaan Repeat Order Baru!</p>
                  <p class="text-xs text-amber-700">Segera follow up customer</p>
                </div>
              </div>
              <button @click="nav('dataProspek')" class="btn-warning text-sm"><i class="fa-solid fa-arrow-right"></i> Lihat</button>
            </div>
          </template>

          <!-- ═══════════ DASHBOARD ═══════════ -->
          <div x-show="page==='dashboard' && hasAccess('dashboard')">
            <!-- Filter periode -->
            <div class="flex justify-end mb-2">
              <div class="inline-flex items-center gap-1.5 bg-white border border-slate-200 rounded-lg px-2.5 py-1 shadow-sm text-xs">
                <i class="fa-solid fa-calendar-days text-slate-500"></i>
                <select x-model="dashFilter.preset" @change="applyDashPreset(dashFilter.preset)" class="border rounded px-1.5 py-0.5 bg-slate-50 text-xs outline-none">
                  <option value="today">Hari Ini</option>
                  <option value="week">7 Hari</option>
                  <option value="month">30 Hari</option>
                  <option value="custom">Custom</option>
                </select>
                <input type="date" x-model="dashFilter.start" @change="onDashDateChange()" class="border rounded px-1.5 py-0.5 bg-slate-50 text-xs">
                <span class="text-slate-400">—</span>
                <input type="date" x-model="dashFilter.end" @change="onDashDateChange()" class="border rounded px-1.5 py-0.5 bg-slate-50 text-xs">
              </div>
            </div>

            <!-- KPI Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-2">
              <div class="card kpi-tight">
                <p class="text-[11px] text-slate-500">Total Prospek</p>
                <p class="text-xl font-bold" x-text="dashStats.totalProspek"></p>
              </div>
              <div class="card kpi-tight">
                <p class="text-[11px] text-slate-500">Repeat Order</p>
                <p class="text-xl font-bold text-amber-600" x-text="dashStats.repeatOrder"></p>
              </div>
              <div class="card kpi-tight">
                <p class="text-[11px] text-slate-500">Site No Complete</p>
                <p class="text-xl font-bold text-indigo-600" x-text="dashStats.complete"></p>
              </div>
              <div class="card kpi-tight">
                <p class="text-[11px] text-slate-500">Total Order</p>
                <p class="text-xl font-bold text-orange-600" x-text="dashStats.totalOrder"></p>
              </div>
            </div>

            <div class="grid grid-cols-3 gap-2 mb-3">
              <div class="card kpi-tight">
                <p class="text-[11px] text-slate-500">Qty Order (m³)</p>
                <p class="text-lg font-bold" x-text="fmt(dashStats.qtyOrder)"></p>
              </div>
              <div class="card kpi-tight">
                <p class="text-[11px] text-slate-500">Qty Delivered (m³)</p>
                <p class="text-lg font-bold text-emerald-600" x-text="fmt(dashStats.qtyDelivered)"></p>
              </div>
              <div class="card kpi-tight">
                <p class="text-[11px] text-slate-500">Delivery Rate</p>
                <p class="text-lg font-bold text-blue-600" x-text="dashDeliveryRate.toFixed(1) + '%'"></p>
              </div>
            </div>

            <!-- Row 1: Trend + Donut -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-2 mb-2">
              <div class="card lg:col-span-2" style="padding:14px;">
                <div class="flex items-center justify-between mb-2 flex-wrap gap-2">
                  <h3 class="text-sm font-semibold"><i class="fa-solid fa-chart-column text-blue-500 mr-1"></i>Order & Delivery Harian (m³)</h3>
                  <div class="flex items-center gap-3 text-[10px]">
                    <span class="inline-flex items-center gap-1"><span class="w-2 h-2 bg-blue-500 rounded-sm"></span>Order</span>
                    <span class="inline-flex items-center gap-1"><span class="w-2 h-2 bg-emerald-500 rounded-sm"></span>Delivered</span>
                  </div>
                </div>
                <div class="flex items-end gap-0.5" style="height:170px">
                  <template x-for="(d, idx) in dashTrendDaily" :key="d.date">
                    <div class="flex-1 flex flex-col justify-end h-full min-w-0">
                      <div class="flex gap-px items-end justify-center w-full" style="height:calc(100% - 20px)">
                        <div class="bg-blue-500 rounded-t w-1/2 max-w-[10px] transition-all"
                             :style="'height:' + Math.max(0, Math.min(100, (d.orderQty/dashTrendMax*100))) + '%'"
                             :title="d.date + ': Order ' + fmt(d.orderQty) + ' m³'"></div>
                        <div class="bg-emerald-500 rounded-t w-1/2 max-w-[10px] transition-all"
                             :style="'height:' + Math.max(0, Math.min(100, (d.delivQty/dashTrendMax*100))) + '%'"
                             :title="d.date + ': Delivered ' + fmt(d.delivQty) + ' m³'"></div>
                      </div>
                      <div x-show="idx % Math.max(1, Math.floor(dashTrendDaily.length / 10)) === 0"
                           class="text-[8px] text-slate-500 text-center truncate" x-text="d.label.split('-')[1]"></div>
                    </div>
                  </template>
                  <template x-if="dashTrendDaily.length === 0">
                    <div class="w-full text-center text-xs text-slate-400 py-8">Pilih rentang tanggal untuk melihat tren</div>
                  </template>
                </div>
              </div>

              <div class="card" style="padding:14px;">
                <h3 class="text-sm font-semibold mb-2"><i class="fa-solid fa-chart-pie text-purple-500 mr-1"></i>Status Order</h3>
                <div class="relative w-28 h-28 mx-auto mb-2">
                  <div class="w-full h-full rounded-full" :style="dashDonutStyle"></div>
                  <div class="absolute inset-3 bg-white rounded-full flex flex-col items-center justify-center">
                    <div class="text-[9px] text-slate-500">Total</div>
                    <div class="text-base font-bold" x-text="dashStatusBreakdown.total"></div>
                  </div>
                </div>
                <div class="space-y-0.5 text-[11px]">
                  <div class="flex items-center justify-between"><span class="flex items-center gap-1.5"><span class="w-2 h-2 bg-blue-500 rounded-full"></span>Open</span><strong x-text="dashStatusBreakdown.open"></strong></div>
                  <div class="flex items-center justify-between"><span class="flex items-center gap-1.5"><span class="w-2 h-2 bg-amber-500 rounded-full"></span>Partial</span><strong x-text="dashStatusBreakdown.partial"></strong></div>
                  <div class="flex items-center justify-between"><span class="flex items-center gap-1.5"><span class="w-2 h-2 bg-emerald-500 rounded-full"></span>Completed</span><strong x-text="dashStatusBreakdown.completed"></strong></div>
                  <div class="flex items-center justify-between"><span class="flex items-center gap-1.5"><span class="w-2 h-2 bg-red-500 rounded-full"></span>Cancelled</span><strong x-text="dashStatusBreakdown.cancelled"></strong></div>
                </div>
              </div>
            </div>

            <!-- Row 2: Weekly + Rates -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-2 mb-2">
              <div class="card lg:col-span-2" style="padding:14px;">
                <div class="flex items-center justify-between mb-2 flex-wrap gap-2">
                  <h3 class="text-sm font-semibold"><i class="fa-solid fa-chart-line text-indigo-500 mr-1"></i>Prospek vs Order per Minggu</h3>
                  <div class="flex items-center gap-3 text-[10px]">
                    <span class="inline-flex items-center gap-1"><span class="w-2 h-2 bg-indigo-500 rounded-sm"></span>Prospek</span>
                    <span class="inline-flex items-center gap-1"><span class="w-2 h-2 bg-orange-500 rounded-sm"></span>Order (m³)</span>
                  </div>
                </div>
                <div class="flex items-end gap-2" style="height:120px">
                  <template x-for="w in dashWeeklyData" :key="w.label">
                    <div class="flex-1 flex flex-col justify-end h-full">
                      <div class="flex gap-1 items-end justify-center w-full" style="height:calc(100% - 18px)">
                        <div class="bg-indigo-500 rounded-t w-1/3 max-w-[16px] transition-all"
                             :style="'height:' + Math.max(0, Math.min(100, (w.prospek/dashWeeklyMaxProspek*100))) + '%'"
                             :title="w.label + ': Prospek ' + w.prospek"></div>
                        <div class="bg-orange-500 rounded-t w-1/3 max-w-[16px] transition-all"
                             :style="'height:' + Math.max(0, Math.min(100, (w.order/dashWeeklyMaxOrder*100))) + '%'"
                             :title="w.label + ': Order ' + fmt(w.order) + ' m³'"></div>
                      </div>
                      <div class="text-[9px] text-slate-500 text-center" x-text="w.label"></div>
                    </div>
                  </template>
                  <template x-if="dashWeeklyData.length === 0">
                    <div class="w-full text-center text-xs text-slate-400 py-6">Tidak ada data</div>
                  </template>
                </div>
              </div>

              <div class="card" style="padding:14px;">
                <h3 class="text-sm font-semibold mb-3"><i class="fa-solid fa-percent text-emerald-500 mr-1"></i>Performance Rate</h3>
                <div class="space-y-3">
                  <div>
                    <div class="flex justify-between text-xs mb-1">
                      <span class="text-slate-600">Delivery Rate</span>
                      <strong x-text="dashDeliveryRate.toFixed(1) + '%'"></strong>
                    </div>
                    <div class="h-2 bg-slate-200 rounded-full overflow-hidden">
                      <div class="h-full bg-emerald-500 rounded-full transition-all" :style="'width:' + dashDeliveryRate + '%'"></div>
                    </div>
                    <div class="text-[10px] text-slate-400 mt-0.5" x-text="fmt(dashStats.qtyDelivered) + ' / ' + fmt(dashStats.qtyOrder) + ' m³'"></div>
                  </div>
                  <div>
                    <div class="flex justify-between text-xs mb-1">
                      <span class="text-slate-600">Repeat Order Rate</span>
                      <strong x-text="dashRepeatOrderRate.toFixed(1) + '%'"></strong>

          <!-- ═══════════ INPUT PROSPEK ═══════════ -->
          <div x-show="page==='inputProspek' && hasAccess('inputProspek')">

                  <button class="btn-primary"><i class="fa-solid fa-save"></i> Save</button>
                </div>
              </form>
            </div>
          </div>

          <!-- ═══════════ DATA PROSPEK ═══════════ -->
          <div x-show="page==='dataProspek' && hasAccess('dataProspek')">
            <div class="card mb-4">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <input x-model="pFilter.q" placeholder="Cari project..." class="input">
                <select x-model="pFilter.source" class="input">
                  <option value="">Semua Sumber</option>
                  <option value="internal">Internal</option>
                  <option value="customer_repeat">Repeat Order</option>
                </select>
                <select x-model="pFilter.status" class="input">
                  <option value="">Semua Status</option>
                  <option value="waiting">Waiting</option>
                  <option value="propose_site_no">Propose Site No</option>
                  <option value="complete">Complete</option>
                  <option value="held">Hold</option>
                </select>
              </div>
            </div>

              <table>
                <thead>
                  <tr>
                    <th class="th">Project Name</th>
                    <th class="th">Visit</th>
                    <th class="th">Sumber</th>
                    <th class="th">Site No</th>
                    <th class="th">PIC Project</th>
                    <th class="th">Status</th>
                    <th class="th">Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="p in filteredProspek" :key="p.id">
                    <tr :class="(p.source||'internal')==='customer_repeat' && !p.sales_id ? 'bg-amber-50' : ''">
                      <td class="td font-medium" x-text="p.project_name"></td>
                      <td class="td">
                        <template x-if="p.visit_status==='done'">
                          <span class="badge bg-emerald-100 text-emerald-700 cursor-not-allowed opacity-80" title="Visit sudah DONE (Final) — terkunci">
                            <i class="fa-solid fa-lock mr-1"></i><span>DONE</span>
                          </span>
                        </template>
                        <template x-if="p.visit_status!=='done'">
                          <button @click="openVisit(p)" class="badge bg-slate-200 text-slate-600 hover:bg-slate-300" title="Klik untuk isi detail visit">
                            <i class="fa-regular fa-circle mr-1"></i><span>NOT YET</span>
                          </button>
                        </template>
                      </td>
                      <td class="td">
                        <template x-if="(p.source||'internal')==='customer_repeat'"><span class="badge bg-orange-100 text-orange-700"><i class="fa-solid fa-rotate mr-1"></i>Repeat</span></template>
                        <template x-if="(p.source||'internal')!=='customer_repeat'"><span class="badge bg-slate-100 text-slate-600">Internal</span></template>
                      </td>
                      <td class="td">
                        <template x-if="p.site_no"><span class="font-mono text-xs bg-slate-100 px-2 py-1 rounded" x-text="p.site_no"></span></template>
                        <template x-if="!p.site_no"><span class="text-yellow-600 text-xs">waiting</span></template>
                      </td>
                      <td class="td" x-text="p.pic_name||'-'"></td>
                      <td class="td">
                        <template x-if="(p.site_no_status||'waiting')==='waiting'"><span class="badge bg-yellow-100 text-yellow-700">Waiting</span></template>
                        <template x-if="(p.site_no_status||'waiting')==='propose_site_no'"><span class="badge bg-blue-100 text-blue-700">Propose Site No</span></template>
                        <template x-if="(p.site_no_status||'waiting')==='complete'"><span class="badge bg-emerald-100 text-emerald-700">✅ Complete / Release</span></template>
                        <template x-if="(p.site_no_status||'waiting')==='held'"><span class="badge bg-red-100 text-red-700" :title="p.hold_reason"><i class="fa-solid fa-pause mr-1"></i>HOLD</span></template>
                        <template x-if="(p.source||'internal')==='customer_repeat' && !p.sales_id && (p.site_no_status||'')==='waiting'">
                          <span class="badge bg-amber-200 text-amber-800 ml-1"><i class="fa-solid fa-hourglass-half mr-1"></i>Perlu Follow Up</span>
                        </template>
                      </td>
                      <td class="td">
                        <div class="flex gap-2 items-center">
                          <template x-if="p.site_no_status==='complete' && p.site_no">

                            <button @click="showRequestDetail(p)" class="text-amber-600 hover:underline text-xs whitespace-nowrap"><i class="fa-solid fa-eye"></i> Detail</button>
                          </template>
                          <template x-if="(p.source||'internal')==='customer_repeat' && !p.sales_id && currentUser.role==='sales'">
                            <button @click="claimProspek(p)" class="btn-warning text-xs whitespace-nowrap"><i class="fa-solid fa-hand"></i> Ambil</button>
                          </template>
                          <template x-if="isOwnerOrAdmin()">
                            <button @click="openEditProspek(p)" class="text-blue-600 hover:text-blue-800 text-xs whitespace-nowrap" title="Edit prospek (Owner/Admin)"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                          </template>
                          <template x-if="isOwnerOrDeveloper()">
                            <button @click="deleteProspect(p)" class="text-red-600 hover:text-red-800 text-xs whitespace-nowrap" title="Hapus prospek (Owner only)"><i class="fa-solid fa-trash"></i></button>
                          </template>
                        </div>
                      </td>
                    </tr>
                  </template>
                  <template x-if="filteredProspek.length===0">
                    <tr><td colspan="7" class="td text-center py-8 text-slate-400">Belum ada data</td></tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

          <!-- ═══════════ INPUT ORDER ═══════════ -->
          <div x-show="page==='inputOrder' && hasAccess('inputOrder')">

              <form @submit.prevent="saveOrder()" class="space-y-4">
                <div>
                  <label class="label">Site No *</label>

                    <template x-for="s in completeSites" :key="s.id"><option :value="s.site_no" x-text="s.site_no + ' — ' + s.project_name"></option></template>
                  </datalist>
                </div>

                  <div><label class="label text-xs">Alamat</label><input :value="oForm.address" readonly class="input bg-white"></div>
                  <div><label class="label text-xs">PO No</label><input :value="oForm.po_no" readonly class="input bg-white"></div>
                  <div><label class="label text-xs">PIC</label><input :value="oForm.pic_name" readonly class="input bg-white"></div>
                </div>
                <div class="grid grid-cols-2 gap-4">

                    <label class="label">Mutu *</label>

                    </select>
                  </div>
                  <div>
                    <label class="label">Plant * <span class="text-xs text-slate-400" x-show="oForm.plant_list && oForm.plant_list.length < plants.length">(hanya plant yg diizinkan owner)</span></label>
                    <select x-model="oForm.plant_id" required class="input">
                      <option value="">-- Pilih Plant --</option>
                      <template x-for="p in (oForm.plant_list && oForm.plant_list.length ? oForm.plant_list : plants)" :key="p.id">
                        <option :value="p.id" x-text="p.name"></option>
                      </template>
                    </select>
                  </div>
                  <div><label class="label">Delivery Date *</label><input type="date" x-model="oForm.delivery_date" required class="input"></div>
                  <div><label class="label">Pouring Time *</label><input type="time" x-model="oForm.pouring_time" required class="input"></div>

                    <label class="label">Metode Cor *</label>
                    <select x-model="oForm.metode_cor" required class="input">
                      <option value="">-- Pilih --</option>
                      <template x-for="m in ['Pompa','Manual','Chute','Conveyor']" :key="m"><option x-text="m" :value="m"></option></template>
                    </select>
                  </div>
                </div>
                <div class="flex justify-end gap-2 pt-4 border-t">
                  <button type="button" @click="nav('jadwal')" class="btn-secondary">Batal</button>
                  <button class="btn-primary"><i class="fa-solid fa-save"></i> Save Order</button>
                </div>
              </form>
            </div>
          </div>

          <!-- ═══════════ JADWAL PENGECORAN ═══════════ -->

            <template x-if="currentUser.role==='customer'">

                      <th class="th">Qty Ord</th>
                      <th class="th">Qty Del</th>

                            <div class="flex items-center gap-1 mb-1">

                              <template x-if="(d.status||'delivered')!=='delivered'"><span class="strikethrough text-red-600" :title="d.remarks" x-text="`${d.truck_no} — ${fmt(d.qty)} m³`"></span></template>

                              <template x-if="(d.status||'delivered')==='rejected'"><span class="badge bg-orange-100 text-orange-700 text-xs">REJECT</span></template>
                              <template x-if="hasAccess('orderSearch') && !isOrderFinished(o)">

                                <span class="text-emerald-600 text-xs" title="Order Complete/Finished — pengiriman terkunci"><i class="fa-solid fa-lock"></i></span>

                          </template>
                          <template x-if="o.status==='cancelled'"><span class="text-red-600 text-xs"><i class="fa-solid fa-ban"></i> Cancelled</span></template>
                          <template x-if="currentUser.role==='customer'"><button @click="openOneClickOrder(o)" class="btn-success text-xs"><i class="fa-solid fa-cart-plus"></i> Order Lagi</button></template>
                        </td>

                    </template>

                          <template x-if="!hasDelivery(o.id)">

                          </template>
                          <template x-if="hasDelivery(o.id)">
                            <span class="text-slate-400 text-xs cursor-not-allowed" title="Tidak bisa cancel — sudah ada pengiriman"><i class="fa-solid fa-lock"></i> Cancel</span>
                          </template>
                        </template>
                        <template x-if="o.status==='cancelled'"><span class="text-red-600 text-xs"><i class="fa-solid fa-ban"></i> Cancelled</span></template>

                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

          <!-- ═══════════ MARKETING ═══════════ -->
          <div x-show="page==='marketing' && hasAccess('marketing')">
            <div class="card mb-4">
              <div class="relative" @click.outside="mktSuggestOpen=false">

                <div class="flex gap-2 items-stretch">
                  <div class="relative flex-1">
                    <input type="text" x-model="mktFilter.siteSearch" @input="onMktSearchInput()" @keydown.enter.prevent="onMktSearchEnter()" @keydown.escape="mktSuggestOpen=false" @focus="mktFilter.siteSearch && (mktSuggestOpen=true)" placeholder="Ketik atau paste Site No / Project Name, lalu tekan Enter..." autocomplete="off" class="input pr-10">
                    <template x-if="mktFilter.siteSearch">
                      <button type="button" @click="resetMktSearch()" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-red-600" title="Bersihkan pencarian"><i class="fa-solid fa-circle-xmark"></i></button>
                    </template>
                  </div>
                  <button type="button" @click="resetMktSearch()" class="btn-secondary whitespace-nowrap" title="Reset"><i class="fa-solid fa-rotate-left"></i> Reset</button>
                </div>

                <div class="mt-2 text-xs">
                  <template x-if="mktSelectedSite">
                    <div class="inline-flex items-center gap-2 px-2 py-1 rounded bg-emerald-50 text-emerald-700 border border-emerald-200">
                      <i class="fa-solid fa-check-circle"></i>
                      <span>Terpilih: <strong class="font-mono" x-text="mktSelectedSite.site_no"></strong></span>
                      <span class="text-emerald-600">—</span>
                      <span x-text="mktSelectedSite.project_name"></span>
                    </div>
                  </template>
                  <template x-if="!mktSelectedSite && mktFilter.siteSearch">
                    <div class="inline-flex items-center gap-2 px-2 py-1 rounded bg-amber-50 text-amber-700 border border-amber-200">

                      <span>Tidak ada site yang cocok. Coba kata kunci lain.</span>
                    </div>
                  </template>

                    <span x-text="mktSuggestions.length"></span> hasil cocok — klik untuk memilih
                  </div>
                  <template x-for="s in mktSuggestions" :key="s.id">
                    <div @click="selectMktSite(s)" class="px-3 py-2 cursor-pointer hover:bg-red-50 border-b border-slate-100 last:border-0">
                      <div class="font-mono font-semibold text-blue-700 text-sm" x-text="s.site_no"></div>
                      <div class="text-xs text-slate-500" x-text="s.project_name"></div>
                    </div>

              </div>
            </template>

            <template x-if="mktSelectedSite">
              <div>
                <div class="card mb-4">
                  <div class="flex flex-wrap items-center gap-3">
                    <div class="bg-blue-100 text-blue-700 px-3 py-1 rounded-lg font-mono text-sm" x-text="mktSelectedSite.site_no"></div>
                    <div class="font-semibold text-lg" x-text="mktSelectedSite.project_name"></div>
                    <div class="text-sm text-slate-500" x-text="mktSelectedSite.pic_name ? 'PIC: ' + mktSelectedSite.pic_name : ''"></div>
                    <div class="ml-auto">
                      <template x-if="mktSelectedSite.site_no_status==='complete'"><span class="badge bg-emerald-100 text-emerald-700"><i class="fa-solid fa-check mr-1"></i>Approved</span></template>
                      <template x-if="mktSelectedSite.site_no_status==='held'"><span class="badge bg-red-100 text-red-700"><i class="fa-solid fa-pause mr-1"></i>Hold</span></template>
                    </div>
                  </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                  <div class="card">
                    <p class="text-sm text-slate-500">Qty PO</p>

                    <p class="text-xs text-slate-400 mt-1" x-text="mktStats.hasLimit ? 'Kuota PO' : 'Belum diset'"></p>
                  </div>
                  <div class="card">
                    <p class="text-sm text-slate-500">Qty Ordered</p>
                    <p class="text-2xl font-bold text-orange-600" x-text="fmt(mktStats.totalOrdered)+' m³'"></p>

                  </div>
                  <div class="card">
                    <p class="text-sm text-slate-500">Qty Delivered</p>
                    <p class="text-2xl font-bold text-emerald-600" x-text="fmt(mktStats.totalDelivered)+' m³'"></p>
                    <p class="text-xs text-slate-400 mt-1">Total terkirim</p>
                  </div>
                  <div class="card">
                    <p class="text-sm text-slate-500">Remain Qty PO</p>
                    <p class="text-2xl font-bold" :class="!mktStats.hasLimit ? 'text-slate-400' : (mktStats.remainPO < 0 ? 'text-red-600' : 'text-emerald-600')" x-text="mktStats.hasLimit ? fmt(mktStats.remainPO)+' m³' : '-'"></p>
                    <p class="text-xs text-slate-400 mt-1" x-text="!mktStats.hasLimit ? 'Tanpa batas PO' : (mktStats.remainPO < 0 ? '⚠️ Over PO!' : 'Sisa kuota PO')"></p>
                  </div>
                </div>

                <div class="card mb-4 overflow-x-auto">
                  <h3 class="font-semibold mb-3"><i class="fa-solid fa-cart-shopping mr-2 text-blue-600"></i>Daftar Order</h3>
                  <table>
                    <thead>
                      <tr>
                        <th class="th">Order No</th><th class="th">Tgl Kirim</th><th class="th">Mutu</th>

                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="d in mktDeliveries" :key="d.id">
                        <tr :class="(d.status==='cancelled'||d.status==='rejected') ? 'bg-red-50 opacity-75' : ''">
                          <td class="td text-xs" x-text="d.delivery_date"></td>
                          <td class="td font-mono text-xs" x-text="d.sj_no || '-'"></td>
                          <td class="td font-mono text-xs" x-text="orderById(d.order_id)?.order_no || '-'"></td>
                          <td class="td" x-text="mutuCode(orderById(d.order_id)?.mutu_id)"></td>

                          <td class="td font-mono" x-text="d.truck_no"></td>

                          <td class="td text-xs" x-text="d.driver_name || '-'"></td>

                            <template x-if="d.status==='rejected'"><span class="badge bg-orange-100 text-orange-700">Rejected</span></template>
                            <template x-if="d.status==='cancelled'"><span class="badge bg-red-100 text-red-700">Cancelled</span></template>

                      </template>

                    </tbody>
                  </table>
                </div>
              </div>
            </template>
          </div>

          <!-- ═══════════ AFTER DELIVERY ═══════════ -->
          <div x-show="page==='afterDelivery' && hasAccess('afterDelivery')">
            <div class="card mb-4">
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-2">
                <input x-model="adFilter.q" placeholder="Order No / Site No / Project / No SJ" class="input">
                <select x-model="adFilter.plant_id" class="input">
                  <option value="">Semua Plant</option>
                  <template x-for="p in plants" :key="p.id"><option :value="String(p.id)" x-text="p.name"></option></template>
                </select>
                <input type="date" x-model="adFilter.date_from" class="input" title="Tanggal kirim mulai">
                <input type="date" x-model="adFilter.date_to" class="input" title="Tanggal kirim sampai">
                <select x-model="adFilter.status" class="input">
                  <option value="">Semua Status</option>

                      </td>
                      <td class="td">
                        <template x-if="(d.status||'delivered')==='delivered'"><span class="badge bg-emerald-100 text-emerald-700"><i class="fa-solid fa-check mr-1"></i>Delivered</span></template>

                      <td class="td" x-text="plantName(orderById(d.order_id)?.plant_id)"></td>
                      <td class="td font-mono" x-text="d.truck_no"></td>

                            </template>
                          </div>
                        </template>
                        <template x-if="!p.visit_mutu_code"><span class="text-slate-400 text-xs italic">Belum diisi</span></template>
                      </td>
                      <td class="td">
                        <template x-if="p.qty_po"><span class="font-semibold text-blue-700" x-text="fmt(p.qty_po)+' m³'"></span></template>
                        <template x-if="!p.qty_po"><span class="text-slate-400 text-xs">-</span></template>

            <input x-model="epForm.competitor_other" class="input" placeholder="Tulis nama kompetitor lain...">
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t">
            <button type="button" @click="editProspekModal.show=false" class="btn-secondary">Batal</button>
            <button class="btn-success"><i class="fa-solid fa-save"></i> Simpan Perubahan</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- Modal: One-Click Order -->
  <template x-if="ocModal.show">
    <div class="modal-bg" @click.self="ocModal.show=false">
      <div class="modal-box" style="max-width:560px">
        <div class="p-4 border-b flex justify-between items-center bg-emerald-50">
          <div>
            <h3 class="font-semibold text-emerald-800"><i class="fa-solid fa-cart-plus mr-1"></i><span x-text="ocModal.mode==='repeat'?'Repeat Order':'Buat Order Baru'"></span></h3>
            <p class="text-xs text-emerald-600">Tim sales akan follow up Anda</p>
          </div>
          <button @click="ocModal.show=false" class="text-slate-400"><i class="fa-solid fa-times"></i></button>
        </div>
        <form @submit.prevent="saveOneClickOrder()" class="p-4 space-y-3">
          <template x-if="ocModal.mode==='repeat' && ocModal.data">
            <div class="bg-slate-50 p-3 rounded-lg text-sm space-y-1">
              <div class="flex justify-between"><span class="text-slate-500">Order Ref:</span><strong x-text="ocModal.data.order_no"></strong></div>
              <div class="flex justify-between"><span class="text-slate-500">Project:</span><strong x-text="ocModal.data.project_name"></strong></div>
              <div class="flex justify-between"><span class="text-slate-500">Site No:</span><strong class="font-mono" x-text="ocModal.data.site_no"></strong></div>
            </div>
          </template>
          <template x-if="ocModal.mode==='new'">
            <div>
              <label class="label">Pilih Site No *</label>
              <select x-model="ocForm.site_no" required class="input">
                <option value="">-- Pilih Proyek --</option>
                <template x-for="s in customerSites" :key="s.id"><option :value="s.site_no" x-text="s.site_no + ' — ' + s.project_name"></option></template>
              </select>
            </div>
          </template>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="label">Delivery Date *</label><input type="date" x-model="ocForm.delivery_date" required class="input"></div>
            <div><label class="label">Pouring Time *</label><input type="time" x-model="ocForm.pouring_time" required class="input"></div>
            <div class="col-span-2"><label class="label">Qty Order (m³) *</label><input type="number" step="0.01" x-model.number="ocForm.qty_order" required class="input"></div>
            <div class="col-span-2">
              <label class="label">Metode Cor *</label>
              <select x-model="ocForm.metode_cor" required class="input">
                <option value="">-- Pilih --</option>
                <template x-for="m in ['Pompa','Manual','Chute','Conveyor']" :key="m"><option :value="m" x-text="m"></option></template>
              </select>
            </div>
            <div class="col-span-2"><label class="label">Catatan</label><textarea x-model="ocForm.note" rows="2" class="input"></textarea></div>
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t">
            <button type="button" @click="ocModal.show=false" class="btn-secondary">Batal</button>
            <button class="btn-success"><i class="fa-solid fa-paper-plane"></i> Kirim Permintaan Order</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- Modal: Detail Request -->
  <template x-if="reqModal.show">
    <div class="modal-bg" @click.self="reqModal.show=false">
      <div class="modal-box" style="max-width:520px">
        <div class="p-4 border-b flex justify-between items-center bg-amber-50">
          <h3 class="font-semibold text-amber-800"><i class="fa-solid fa-rotate mr-2"></i>Detail Repeat Order</h3>
          <button @click="reqModal.show=false" class="text-slate-400"><i class="fa-solid fa-times"></i></button>
        </div>
        <div class="p-4 space-y-3 text-sm">
          <div><span class="text-slate-500 text-xs">Diminta Oleh:</span><div class="font-medium text-blue-700" x-text="reqModal.data?.requested_by_name"></div></div>
          <div><span class="text-slate-500 text-xs">Project:</span><div class="font-medium" x-text="reqModal.data?.project_name"></div></div>
          <div class="grid grid-cols-2 gap-2">
            <div><span class="text-slate-500 text-xs">Site No:</span><div class="font-mono" x-text="reqModal.data?.site_no"></div></div>
            <div><span class="text-slate-500 text-xs">Qty:</span><div class="font-medium" x-text="fmt(reqModal.data?.request_qty)+' m³'"></div></div>
          </div>
        </div>
        <div class="p-4 border-t flex justify-end gap-2">
          <button @click="reqModal.show=false" class="btn-secondary">Tutup</button>
          <template x-if="!reqModal.data?.sales_id && currentUser?.role==='sales'">
            <button @click="claimProspek(reqModal.data); reqModal.show=false" class="btn-warning"><i class="fa-solid fa-hand"></i> Ambil & Follow Up</button>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- Modal: Edit User -->
  <template x-if="editUserModal.show">
    <div class="modal-bg" @click.self="editUserModal.show=false">
      <div class="modal-box" style="max-width:560px">
        <div class="p-4 border-b flex justify-between items-center bg-blue-50">
          <h3 class="font-semibold text-blue-800"><i class="fa-solid fa-user-pen mr-1"></i>Edit User</h3>
          <button @click="editUserModal.show=false" class="text-slate-400"><i class="fa-solid fa-times"></i></button>
        </div>
        <form @submit.prevent="saveEditUser()" class="p-4 space-y-3">
          <div><label class="label">User ID *</label><input x-model="euForm.username" required class="input" pattern="[A-Za-z0-9_.\-]+"></div>
          <div><label class="label">Nama Lengkap *</label><input x-model="euForm.name" required class="input"></div>
          <div><label class="label">Email</label><input x-model="euForm.email" type="email" class="input"></div>
          <div>
            <label class="label">Password *</label>
            <div class="relative">
              <input x-model="euForm.password" :type="showEditUserPw?'text':'password'" required minlength="6" class="input pr-10">
              <button type="button" @click="showEditUserPw=!showEditUserPw" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"><i :class="showEditUserPw?'fa-solid fa-eye-slash':'fa-solid fa-eye'"></i></button>
            </div>
          </div>
          <div>
            <label class="label">Role *</label>
            <select x-model="euForm.role" required class="input">
              <option value="owner">Owner</option>
              <option value="admin">Admin</option>
              <option value="sales">Sales</option>
              <option value="logistik">Logistik</option>
              <option value="customer">Customer</option>
            </select>
          </div>
          <div>
            <label class="label">Status Akun</label>
            <div class="flex gap-4 items-center">
              <label class="inline-flex items-center gap-2 text-sm"><input type="radio" :value="true" x-model="euForm.is_active"> <span class="text-emerald-600 font-medium">Aktif</span></label>
              <label class="inline-flex items-center gap-2 text-sm"><input type="radio" :value="false" x-model="euForm.is_active"> <span class="text-red-600 font-medium">Nonaktif</span></label>
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t">
            <button type="button" @click="editUserModal.show=false" class="btn-secondary">Batal</button>
            <button class="btn-success"><i class="fa-solid fa-save"></i> Simpan</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- Modal: Visit -->
  <template x-if="visitModal.show">
    <div class="modal-bg" @click.self="visitModal.show=false">
      <div class="modal-box">
        <div class="p-4 border-b flex justify-between items-center sticky top-0 bg-white">
          <h3 class="font-semibold">Visit Project Detail — <span class="text-blue-600" x-text="visitModal.project_name"></span></h3>
          <button @click="visitModal.show=false" class="text-slate-400"><i class="fa-solid fa-times"></i></button>
        </div>
        <form @submit.prevent="saveVisit()" class="p-4 space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div><label class="label">Estimasi Tgl Cor</label><input type="date" x-model="vForm.estimasi_tgl_cor" class="input"></div>
            <div><label class="label">Jam Loading</label><input type="time" x-model="vForm.jam_loading" class="input"></div>
            <div>
              <label class="label">Mutu</label>
              <select x-model="vForm.mutu_id" class="input">
                <option value="">-- Pilih --</option>
                <template x-for="m in mutuList" :key="m.id"><option :value="m.id" x-text="`${m.code} — ${m.name}`"></option></template>
              </select>
            </div>
            <div><label class="label">Estimasi Volume (m³)</label><input type="number" step="0.01" x-model.number="vForm.estimasi_volume" class="input"></div>
            <div>
              <label class="label">Plant Name</label>
              <select x-model="vForm.plant_id" class="input">
                <option value="">-- Pilih --</option>
                <template x-for="p in plants" :key="p.id"><option :value="p.id" x-text="p.name"></option></template>
              </select>
            </div>
            <div>
              <label class="label">Metode Cor</label>
              <select x-model="vForm.metode_cor" class="input">
                <option value="">-- Pilih --</option>
                <template x-for="m in ['Pompa','Manual','Chute','Conveyor']" :key="m"><option x-text="m" :value="m"></option></template>
              </select>
            </div>
          </div>
          <div class="border-t pt-3">
            <label class="label">Status</label>
            <div class="flex gap-4 items-center">
              <label><input type="checkbox" x-model="vForm.win" @change="vForm.win && (vForm.lost=false)"> <span class="text-emerald-600 font-medium">WIN</span></label>
              <label><input type="checkbox" x-model="vForm.lost" @change="vForm.lost && (vForm.win=false)"> <span class="text-red-600 font-medium">LOST</span></label>
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t">
            <button type="button" @click="visitModal.show=false" class="btn-secondary">Batal</button>
            <button class="btn-success"><i class="fa-solid fa-save"></i> Save Visit</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- Modal: Delivery -->
  <template x-if="dvModal.show">
    <div class="modal-bg" @click.self="dvModal.show=false">
      <div class="modal-box" style="max-width:520px">
        <div class="p-4 border-b flex justify-between items-center">
          <h3 class="font-semibold">Update Delivery — <span class="text-blue-600" x-text="dvModal.site_no"></span></h3>
          <button @click="dvModal.show=false" class="text-slate-400"><i class="fa-solid fa-times"></i></button>
        </div>
        <form @submit.prevent="saveDelivery()" class="p-4 space-y-3">
          <div class="bg-slate-50 p-3 rounded-lg text-xs space-y-1">
            <div class="flex justify-between"><span class="text-slate-500">Order No:</span><strong class="font-mono" x-text="dvModal.order_no"></strong></div>
            <div class="flex justify-between"><span class="text-slate-500">Delivery Date:</span><strong x-text="dvModal.order_delivery_date"></strong></div>
          </div>
          <div>
            <label class="label">Delivery Date <span class="text-xs text-slate-400">(dari Order Awal — tidak dapat diubah)</span></label>
            <input type="date" x-model="dvForm.delivery_date" readonly class="input bg-slate-100 cursor-not-allowed" tabindex="-1">
          </div>
          <div>
            <label class="label">No Surat Jalan (SJ) <span class="text-xs text-slate-400">(opsional)</span></label>
            <input x-model="dvForm.sj_no" class="input font-mono" placeholder="cth: SJ/20261002/001">
          </div>
          <div><label class="label">No Truck *</label><input x-model="dvForm.truck_no" required class="input" placeholder="B 1234 XY"></div>
          <div><label class="label">Muatan (m³) *</label><input type="number" step="0.01" x-model.number="dvForm.qty" required class="input" :max="dvModal.remain"></div>
          <div><label class="label">Driver</label><input x-model="dvForm.driver_name" class="input"></div>
          <p class="text-xs text-slate-500">Sisa: <span x-text="fmt(dvModal.remain)"></span> m³</p>
          <p class="text-xs text-slate-500 bg-blue-50 p-2 rounded mt-2"><i class="fa-solid fa-info-circle text-blue-500"></i> Setelah disimpan, pengiriman dapat diedit ulang bila ada reject / cancel dari pihak project.</p>
          <div class="flex justify-end gap-2 pt-3 border-t">
            <button type="button" @click="dvModal.show=false" class="btn-secondary">Batal</button>
            <button class="btn-success"><i class="fa-solid fa-save"></i> Save Delivery</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- Modal: Approve Site No -->
  <template x-if="propModal.show">
    <div class="modal-bg" @click.self="propModal.show=false">
      <div class="modal-box" style="max-width:600px">
        <div class="p-4 border-b flex justify-between items-center">
          <h3 class="font-semibold">Approval Site No Details</h3>
          <button @click="propModal.show=false" class="text-slate-400"><i class="fa-solid fa-times"></i></button>
        </div>
        <form @submit.prevent="savePropose()" class="p-4 space-y-3">
          <div><label class="label text-xs">Project Name</label><input :value="propModal.data.project_name" readonly class="input bg-slate-50"></div>
          <div><label class="label text-xs">Alamat</label><input :value="propModal.data.address" readonly class="input bg-slate-50"></div>
          <div>
            <label class="label text-xs"><i class="fa-solid fa-flask text-blue-600"></i> Mutu Diminta (dari Visit)</label>
            <input :value="propVisitMutuLabel" readonly class="input bg-blue-50 font-semibold text-blue-700">
          </div>
          <div><label class="label">Site No *</label><input x-model="propForm.site_no" required class="input"></div>
          <div><label class="label">PO No *</label><input x-model="propForm.po_no" required class="input"></div>
          <div>
            <label class="label">Qty PO (m³) *</label>
            <input type="number" step="0.01" min="0.01" x-model.number="propForm.qty_po" required class="input" placeholder="Total kuota PO">
            <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-info-circle"></i> Total qty order untuk site ini tidak boleh melebihi Qty PO</p>
          </div>
          <div>
            <label class="label">Mutu (multi) *</label>
            <div class="grid grid-cols-3 gap-2 border rounded-lg p-2 max-h-40 overflow-y-auto">
              <template x-for="m in mutuList" :key="m.id">
                <label class="inline-flex items-center gap-1 text-sm"><input type="checkbox" :value="m.id" x-model.number="propForm.mutu"> <span x-text="m.code"></span></label>
              </template>
            </div>
          </div>
          <div>
            <label class="label">Plant yang diizinkan * <span class="text-xs text-slate-400">(Sales hanya bisa pilih dari plant ini)</span></label>
            <div class="grid grid-cols-2 gap-2 border rounded-lg p-2 max-h-40 overflow-y-auto">
              <template x-for="pl in plants" :key="pl.id">
                <label class="inline-flex items-center gap-1 text-sm"><input type="checkbox" :value="pl.id" x-model.number="propForm.plant_ids"> <span x-text="pl.name"></span></label>
              </template>
            </div>
            <p x-show="propForm.plant_ids.length===0" class="text-xs text-amber-600 mt-1"><i class="fa-solid fa-info-circle"></i> Kosongkan = semua plant boleh</p>
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t">
            <button type="button" @click="propModal.show=false" class="btn-secondary">Batal</button>
            <button class="btn-success"><i class="fa-solid fa-save"></i> Approve & Save</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- Modal: Edit Order -->
  <template x-if="editOrderModal.show">
    <div class="modal-bg" @click.self="editOrderModal.show=false">
      <div class="modal-box" style="max-width:680px">
        <div class="p-4 border-b flex justify-between items-center sticky top-0 bg-white">
          <h3 class="font-semibold">Edit Order — <span class="text-blue-600" x-text="editOrderModal.data.order_no"></span></h3>
          <button @click="editOrderModal.show=false" class="text-slate-400"><i class="fa-solid fa-times"></i></button>
        </div>
        <form @submit.prevent="saveEditOrder()" class="p-4 space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="label">Mutu *</label>
              <select x-model="eoForm.mutu_id" required class="input">
                <option value="">-- Pilih --</option>
                <template x-for="m in mutuList" :key="m.id"><option :value="m.id" x-text="`${m.code} — ${m.name}`"></option></template>
              </select>
            </div>
            <div>
              <label class="label">Plant *</label>
              <select x-model="eoForm.plant_id" required class="input">
                <template x-for="p in plants" :key="p.id"><option :value="p.id" x-text="p.name"></option></template>
              </select>
            </div>
            <div><label class="label">Delivery Date</label><input type="date" x-model="eoForm.delivery_date" class="input"></div>
            <div><label class="label">Pouring Time</label><input type="time" x-model="eoForm.pouring_time" class="input"></div>
            <div><label class="label">Qty Order (m³)</label><input type="number" step="0.01" x-model.number="eoForm.qty_order" class="input"></div>
            <div>
              <label class="label">Metode Cor</label>
              <select x-model="eoForm.metode_cor" class="input">
                <option value="">-- Pilih --</option>
                <template x-for="m in ['Pompa','Manual','Chute','Conveyor']" :key="m"><option :value="m" x-text="m"></option></template>
              </select>
            </div>
          </div>
          <div class="border-t pt-3">
            <label class="label">Status Order *</label>
            <select x-model="eoForm.status" class="input">
              <option value="pending">Pending</option>
              <option value="scheduled">Scheduled</option>
              <option value="partial">Partial</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <template x-if="editOrderModal.data.cancel_reason">
            <div class="bg-red-50 border border-red-200 rounded-lg p-3 text-xs">
              <span class="text-red-700 font-semibold">Order sudah dibatalkan.</span>
              <div class="text-red-600 italic mt-1">Alasan: <span x-text="editOrderModal.data.cancel_reason"></span></div>
            </div>
          </template>
          <div class="flex justify-between gap-2 pt-3 border-t">
            <template x-if="editOrderModal.data.status!=='cancelled'">
              <button type="button" @click="cancelOrderFromEdit()" class="btn-danger"><i class="fa-solid fa-ban"></i> Cancel Order</button>
            </template>
            <template x-if="editOrderModal.data.status==='cancelled'">
              <span class="text-red-600 text-sm"><i class="fa-solid fa-ban"></i> Order sudah cancelled</span>
            </template>
            <div class="flex gap-2 ml-auto">
              <button type="button" @click="editOrderModal.show=false" class="btn-secondary">Batal</button>
              <button class="btn-success" :disabled="editOrderModal.data.status==='cancelled'"><i class="fa-solid fa-save"></i> Save</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </template>

</div>

</body>
</html>
